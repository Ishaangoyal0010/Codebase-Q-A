version: "3.9"

services:

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: ishaan0010/codebaseqa-backend:v2
    ports:
      - "8000:8000"
    env_file:
      - .env

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    image: ishaan0010/codebaseqa-frontend:v2
    ports:
      - "8501:8501"
    environment:
      - BACKEND_URL=http://backend:8000
    depends_on:
      - backend
